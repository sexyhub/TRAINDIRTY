openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Workout Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workout-plans
    description: Workout plan management
  - name: exercises
    description: Exercise management
  - name: sessions
    description: Workout session logging
  - name: stats
    description: Statistics and progress tracking

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /workout-plans:
    get:
      operationId: getWorkoutPlans
      tags: [workout-plans]
      summary: Get all workout plans
      responses:
        "200":
          description: List of workout plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutPlan"
    post:
      operationId: createWorkoutPlan
      tags: [workout-plans]
      summary: Create a workout plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkoutPlan"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutPlan"

  /workout-plans/{id}:
    get:
      operationId: getWorkoutPlan
      tags: [workout-plans]
      summary: Get a workout plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workout plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutPlanWithExercises"
    put:
      operationId: updateWorkoutPlan
      tags: [workout-plans]
      summary: Update a workout plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkoutPlan"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutPlan"
    delete:
      operationId: deleteWorkoutPlan
      tags: [workout-plans]
      summary: Delete a workout plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /exercises:
    get:
      operationId: getExercises
      tags: [exercises]
      summary: Get exercises (optionally filtered by plan)
      parameters:
        - name: planId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"
    post:
      operationId: createExercise
      tags: [exercises]
      summary: Create an exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExercise"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"

  /exercises/{id}:
    put:
      operationId: updateExercise
      tags: [exercises]
      summary: Update an exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExercise"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
    delete:
      operationId: deleteExercise
      tags: [exercises]
      summary: Delete an exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sessions:
    get:
      operationId: getSessions
      tags: [sessions]
      summary: Get workout sessions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutSession"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Start a workout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSession"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSession"

  /sessions/active:
    get:
      operationId: getActiveSession
      tags: [sessions]
      summary: Get the currently active session
      responses:
        "200":
          description: Active session or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveSessionResponse"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session with its logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSessionDetail"
    put:
      operationId: updateSession
      tags: [sessions]
      summary: Update a session (complete, abort)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSession"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSession"

  /sessions/{id}/sets:
    post:
      operationId: logSet
      tags: [sessions]
      summary: Log a set for an exercise in a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogSet"
      responses:
        "201":
          description: Logged set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetLog"

  /sessions/{id}/sets/{setId}:
    put:
      operationId: updateSetLog
      tags: [sessions]
      summary: Update a logged set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: setId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSetLog"
      responses:
        "200":
          description: Updated set log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetLog"

  /stats/overview:
    get:
      operationId: getStatsOverview
      tags: [stats]
      summary: Get training overview statistics
      responses:
        "200":
          description: Stats overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /stats/streaks:
    get:
      operationId: getStreaks
      tags: [stats]
      summary: Get workout streak data
      responses:
        "200":
          description: Streak data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakData"

  /stats/heatmap:
    get:
      operationId: getHeatmap
      tags: [stats]
      summary: Get calendar heatmap data for workout consistency
      parameters:
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Heatmap data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeatmapEntry"

  /stats/personal-records:
    get:
      operationId: getPersonalRecords
      tags: [stats]
      summary: Get personal records per exercise
      responses:
        "200":
          description: Personal records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalRecord"

  /stats/exercise-progress/{exerciseId}:
    get:
      operationId: getExerciseProgress
      tags: [stats]
      summary: Get progress data for a specific exercise
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exercise progress data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseProgressEntry"

  /stats/weekly-summary:
    get:
      operationId: getWeeklySummary
      tags: [stats]
      summary: Get weekly workout summary
      responses:
        "200":
          description: Weekly summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySummary"

  /stats/monthly-summary:
    get:
      operationId: getMonthlySummary
      tags: [stats]
      summary: Get monthly workout summary
      responses:
        "200":
          description: Monthly summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlySummary"

  /profile:
    get:
      operationId: getProfile
      tags: [stats]
      summary: Get user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateProfile
      tags: [stats]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfile"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    WorkoutPlan:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        dayOfWeek:
          type: integer
          description: "0=Sunday, 1=Monday, ..., 6=Saturday"
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, dayOfWeek, createdAt]

    WorkoutPlanWithExercises:
      allOf:
        - $ref: "#/components/schemas/WorkoutPlan"
        - type: object
          properties:
            exercises:
              type: array
              items:
                $ref: "#/components/schemas/Exercise"
          required: [exercises]

    CreateWorkoutPlan:
      type: object
      properties:
        name:
          type: string
        dayOfWeek:
          type: integer
        notes:
          type: string
          nullable: true
      required: [name, dayOfWeek]

    ExerciseCategory:
      type: string
      enum: [Chest, Back, Legs, Shoulders, Arms, Core, Cardio]

    ExerciseGroup:
      type: string
      enum: [none, superset, circuit]

    Exercise:
      type: object
      properties:
        id:
          type: integer
        planId:
          type: integer
        name:
          type: string
        category:
          $ref: "#/components/schemas/ExerciseCategory"
        sets:
          type: integer
        reps:
          type: integer
        weight:
          type: number
          nullable: true
        restSeconds:
          type: integer
        videoUrl:
          type: string
          nullable: true
        groupType:
          $ref: "#/components/schemas/ExerciseGroup"
        groupId:
          type: string
          nullable: true
        sortOrder:
          type: integer
      required: [id, planId, name, category, sets, reps, restSeconds, groupType, sortOrder]

    CreateExercise:
      type: object
      properties:
        planId:
          type: integer
        name:
          type: string
        category:
          $ref: "#/components/schemas/ExerciseCategory"
        sets:
          type: integer
        reps:
          type: integer
        weight:
          type: number
          nullable: true
        restSeconds:
          type: integer
        videoUrl:
          type: string
          nullable: true
        groupType:
          $ref: "#/components/schemas/ExerciseGroup"
        groupId:
          type: string
          nullable: true
        sortOrder:
          type: integer
      required: [planId, name, category, sets, reps, restSeconds, groupType, sortOrder]

    SessionStatus:
      type: string
      enum: [active, completed, aborted]

    WorkoutSession:
      type: object
      properties:
        id:
          type: integer
        planId:
          type: integer
        planName:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        totalVolume:
          type: number
          nullable: true
      required: [id, planId, planName, status, startedAt]

    WorkoutSessionDetail:
      allOf:
        - $ref: "#/components/schemas/WorkoutSession"
        - type: object
          properties:
            setLogs:
              type: array
              items:
                $ref: "#/components/schemas/SetLog"
          required: [setLogs]

    ActiveSessionResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/WorkoutSessionDetail"
          nullable: true
      required: [session]

    CreateSession:
      type: object
      properties:
        planId:
          type: integer
      required: [planId]

    UpdateSession:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/SessionStatus"
        notes:
          type: string
          nullable: true
      required: [status]

    SetLog:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        exerciseId:
          type: integer
        exerciseName:
          type: string
        setNumber:
          type: integer
        repsCompleted:
          type: integer
          nullable: true
        weightUsed:
          type: number
          nullable: true
        completed:
          type: boolean
        loggedAt:
          type: string
          format: date-time
      required: [id, sessionId, exerciseId, exerciseName, setNumber, completed, loggedAt]

    LogSet:
      type: object
      properties:
        exerciseId:
          type: integer
        setNumber:
          type: integer
        repsCompleted:
          type: integer
          nullable: true
        weightUsed:
          type: number
          nullable: true
        completed:
          type: boolean
      required: [exerciseId, setNumber, completed]

    UpdateSetLog:
      type: object
      properties:
        repsCompleted:
          type: integer
          nullable: true
        weightUsed:
          type: number
          nullable: true
        completed:
          type: boolean
      required: [completed]

    StatsOverview:
      type: object
      properties:
        totalWorkouts:
          type: integer
        weeklyVolume:
          type: number
        totalVolume:
          type: number
        avgWorkoutsPerWeek:
          type: number
        totalSets:
          type: integer
      required: [totalWorkouts, weeklyVolume, totalVolume, avgWorkoutsPerWeek, totalSets]

    StreakData:
      type: object
      properties:
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        lastWorkoutDate:
          type: string
          nullable: true
      required: [currentStreak, longestStreak]

    HeatmapEntry:
      type: object
      properties:
        date:
          type: string
          description: ISO date string (YYYY-MM-DD)
        count:
          type: integer
      required: [date, count]

    PersonalRecord:
      type: object
      properties:
        exerciseId:
          type: integer
        exerciseName:
          type: string
        category:
          $ref: "#/components/schemas/ExerciseCategory"
        maxWeight:
          type: number
          nullable: true
        maxReps:
          type: integer
          nullable: true
        maxSets:
          type: integer
          nullable: true
        achievedAt:
          type: string
          format: date-time
          nullable: true
      required: [exerciseId, exerciseName, category]

    ExerciseProgressEntry:
      type: object
      properties:
        date:
          type: string
        avgWeight:
          type: number
          nullable: true
        maxWeight:
          type: number
          nullable: true
        avgReps:
          type: number
          nullable: true
        totalSets:
          type: integer
      required: [date, totalSets]

    WeeklySummary:
      type: object
      properties:
        weekStart:
          type: string
        weekEnd:
          type: string
        totalWorkouts:
          type: integer
        totalVolume:
          type: number
        totalSets:
          type: integer
        exerciseBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBreakdown"
      required: [weekStart, weekEnd, totalWorkouts, totalVolume, totalSets, exerciseBreakdown]

    MonthlySummary:
      type: object
      properties:
        month:
          type: string
        totalWorkouts:
          type: integer
        totalVolume:
          type: number
        totalSets:
          type: integer
        exerciseBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBreakdown"
        weeklyBreakdown:
          type: array
          items:
            type: object
            properties:
              week:
                type: string
              workouts:
                type: integer
              volume:
                type: number
            required: [week, workouts, volume]
      required: [month, totalWorkouts, totalVolume, totalSets, exerciseBreakdown, weeklyBreakdown]

    CategoryBreakdown:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/ExerciseCategory"
        exerciseCount:
          type: integer
        totalSets:
          type: integer
        totalVolume:
          type: number
      required: [category, exerciseCount, totalSets, totalVolume]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        weight:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
        fitnessGoal:
          type: string
          nullable: true
        unit:
          type: string
          enum: [kg, lbs]
        createdAt:
          type: string
          format: date-time
      required: [id, name, unit, createdAt]

    UpdateUserProfile:
      type: object
      properties:
        name:
          type: string
        weight:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
        fitnessGoal:
          type: string
          nullable: true
        unit:
          type: string
          enum: [kg, lbs]
      required: [name, unit]
