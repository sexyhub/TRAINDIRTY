kind = "web"
previewPath = "/"
title = "Workout Tracker"
version = "1.0.0"
id = "artifacts/workout-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 19273
name = "web"
paths = ["/", "/api"]

[services.development]
run = "pnpm --filter @workspace/workout-tracker run dev"

[services.env]
PORT = "19273"

[services.production]
build = ["pnpm", "--filter", "@workspace/workout-tracker", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/workout-tracker", "run", "start"]

[services.production.run.env]
PORT = "19273"

[services.production.health.startup]
path = "/api/healthz"
